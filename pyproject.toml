[project]
name = "research-paper"
version = "0.1.0"
description = "Reproducible research paper project"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ipykernel>=6.29,<7",
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
